apiVersion: batch/v1
kind: Job
metadata:
  name: sumdiff-repro-{{ORX_RUN}}
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: reproduce
          image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
          command: ["bash", "-c", "$ORX_SCRIPT"]
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
          resources:
            requests:
              nvidia.com/gpu: "8"
              cpu: "24"
              memory: "48Gi"
            limits:
              nvidia.com/gpu: "8"
              cpu: "48"
              memory: "96Gi"
